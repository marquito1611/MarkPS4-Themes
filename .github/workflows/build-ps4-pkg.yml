name: Build PS4 PKG MarkPS4 Themes

on:
  push:
    branches: [master, main]
    paths:
      - "ps4-app/**"
      - "tools/**"
      - "web/**"
      - ".github/workflows/build-ps4-pkg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 python3 python3-pip git curl make unzip zip dpkg-dev
          mkdir -p "$HOME/clang18/usr/lib"
          ln -sfn /usr/lib/llvm-18 "$HOME/clang18/usr/lib/llvm-18"
          mkdir -p "$HOME/bin"
          ln -sfn /usr/bin/clang-18 "$HOME/bin/clang"
          ln -sfn /usr/bin/ld.lld-18 "$HOME/bin/ld.lld"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install OpenOrbis PS4 toolchain
        run: |
          set -euo pipefail
          TOOLROOT="$HOME/ps4tool"
          TOOLCHAIN="$TOOLROOT/OpenOrbis/OpenOrbis/PS4Toolchain"
          if [ ! -x "$TOOLCHAIN/bin/linux/create-fself" ]; then
            mkdir -p "$TOOLROOT/OpenOrbis"
            curl -fL --retry 3 --retry-delay 2 \
              -o "$TOOLROOT/toolchain.tar.gz" \
              "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"
            tar xzf "$TOOLROOT/toolchain.tar.gz" -C "$TOOLROOT/OpenOrbis"
            chmod +x "$TOOLCHAIN"/bin/linux/* || true
          fi
          test -x "$TOOLCHAIN/bin/linux/create-fself"
          test -f "$TOOLCHAIN/lib/crtlib.o"

      - name: Download Assassin's Creed PKGs and generate metadata
        run: |
          set -euo pipefail
          python3 -m venv /tmp/gdown-env
          /tmp/gdown-env/bin/pip install --upgrade gdown
          /tmp/gdown-env/bin/gdown "1KK8yqBinHkxRbuLCY4O4tJzApXvPYm2n" -O /tmp/assassins-creed-package-1.pkg
          /tmp/gdown-env/bin/gdown "1OXuuN5d7hLYxABRVHHP-Qz7AV6-CC1rR" -O /tmp/assassins-creed-package-2.pkg
          python3 - <<'PY'
          import os, pathlib
          pairs = [
              (1, "/tmp/assassins-creed-package-1.pkg", "1KK8yqBinHkxRbuLCY4O4tJzApXvPYm2n"),
              (2, "/tmp/assassins-creed-package-2.pkg", "1OXuuN5d7hLYxABRVHHP-Qz7AV6-CC1rR"),
          ]
          out = ["#pragma once", "/* Generated from the real PKG files by GitHub Actions. */"]
          for n, path, drive_id in pairs:
              data = pathlib.Path(path).read_bytes()
              if len(data) < 0x70 or data[:4] != b"\x7fCNT":
                  raise SystemExit(f"Package {n} is not a valid PS4 PKG header")
              cid = data[0x40:0x70].split(b"\0", 1)[0].decode("ascii", "strict")
              if len(cid) < 20 or "-" not in cid or "_" not in cid:
                  raise SystemExit(f"Could not read content ID from package {n}: {cid!r}")
              out += [
                  f'#define MARKPS4_PKG{n}_URL "https://drive.google.com/uc?export=download&id={drive_id}&confirm=t"',
                  f'#define MARKPS4_PKG{n}_CONTENT_ID "{cid}"',
                  f"#define MARKPS4_PKG{n}_SIZE {len(data)}u",
              ]
              print(f"PKG {n}: {len(data)} bytes; content ID: {cid}")
          pathlib.Path("ps4-app/tile-pkg/pms/theme_packages.h").write_text("\n".join(out) + "\n")
          PY
          rm -f /tmp/assassins-creed-package-1.pkg /tmp/assassins-creed-package-2.pkg

      - name: Build native PS4 Themes PKG
        run: |
          export PATH="$HOME/clang18/usr/lib/llvm-18/bin:$HOME/bin:$PATH"
          bash ps4-app/tile-pkg/build-wsl.sh

      - name: Verify package exists
        run: |
          test -s ps4-app/tile-pkg/IV0000-PKGM00001_00-MARKPS4THEMES001.pkg
          ls -lh ps4-app/tile-pkg/IV0000-PKGM00001_00-MARKPS4THEMES001.pkg

      - name: Upload installable PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: MARKPS4-THEMES-PS4
          path: ps4-app/tile-pkg/IV0000-PKGM00001_00-MARKPS4THEMES001.pkg
          if-no-files-found: error
          retention-days: 14
